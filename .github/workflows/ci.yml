name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: §25.4 gate
        run: go test ./internal/codec -fuzz=FuzzValue -fuzztime=60s
      - name: other targets
        run: |
          for f in FuzzRoundTrip FuzzUvarint FuzzKeyEncoding FuzzKeyReader; do
            go test ./internal/codec -run '^$' -fuzz="^${f}\$" -fuzztime=60s
          done
          for f in FuzzPage FuzzForgedPage FuzzSuperblock FuzzForgedSuperblock FuzzBitmapExtents; do
            go test ./internal/page -run '^$' -fuzz="^${f}\$" -fuzztime=60s
          done

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: scripts/check-nocgo.sh

  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forbidden names (§2.1)
        env:
          PATTERN: ${{ vars.FORBIDDEN_NAMES_REGEX }}
        run: |
          if [ -z "$PATTERN" ]; then
            echo "::error::repository variable FORBIDDEN_NAMES_REGEX is not set"
            exit 1
          fi
          if git grep -n -I -i -E -e "$PATTERN" -- . ; then
            echo "::error::forbidden name found (§2.1)"
            exit 1
          fi
